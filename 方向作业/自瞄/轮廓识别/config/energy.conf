# All paths are relative to this file.
input_video=../input/energy_mechanism.mp4
output_video=../output/energy_result.mp4
output_csv=../output/energy_result.csv

# HSV red segmentation. OpenCV hue is [0, 179], so red uses two ends.
red_h_low=12
red_h_high=170
red_s_min=80
red_v_min=60
morphology_kernel=3

# The R mark is a compact 50 x 50 red component in this recording.
component_min_area=100
marker_min_area=500
marker_max_area=6000
marker_min_width=25
marker_max_width=100
marker_min_height=25
marker_max_height=100
marker_min_aspect=0.45
marker_max_aspect=2.2
marker_expected_area=1900

# The unactivated arm is smaller than a fully lit blade in this recording.
active_arm_min_area=8000
active_arm_max_area=26000
active_arm_expected_area=20000
active_arm_min_radius=100

# Predict the next 100 ms of the R center and target plate.
prediction_seconds=0.10
output_scale=0.333333
show_preview=1
